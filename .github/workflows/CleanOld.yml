name: Cleanup Releases with CLI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          KEEP=5
          echo "将在 $REPO 中保留最新的 $KEEP 个 Release（按发布时间）"

          # 1. 获取所有 Release，按发布时间降序排列，跳过前 KEEP 个，提取出待删除的 tag
          gh release list -R "$REPO" --limit 100 --json tagName,publishedAt \
            | jq -r "sort_by(.publishedAt) | reverse | .[$KEEP:] | .[].tagName" \
            | while read -r tag; do
                if [ -n "$tag" ]; then
                  echo "准备删除: $tag"
                  # 2. 实际删除命令（先注释掉，用于预览）
                  gh release delete "$tag" -R "$REPO" --cleanup-tag --yes
                fi
              done
